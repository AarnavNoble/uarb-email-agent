[project]
name = "uarb-email-agent"
version = "0.1.0"
description = "Email agent that fetches Nova Scotia UARB matter documents and replies with a summary and a ZIP."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.2.0",
    "google-auth>=2.62.0",
    "html2text>=2025.4.15",
    "imap-tools>=1.16.0",
    "jinja2>=3.1.6",
    "playwright>=1.64.1",
    "pydantic>=2",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
]

[project.scripts]
uarb-agent = "uarb_agent.cli:main"

[build-system]
requires = ["uv_build>=0.9.29,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "uarb_agent"
module-root = ""

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits the real UARB site (run with -m live)"]
addopts = "-m 'not live'"

[dependency-groups]
dev = [
    "google-auth-oauthlib>=1.5.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]
